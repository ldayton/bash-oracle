name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: ./configure

      - name: Build
        run: make -j$(sysctl -n hw.ncpu) CFLAGS="-DBASH_ORACLE -O2"

      - name: Run tests
        run: python3 -m unittest test_bash_oracle -v
